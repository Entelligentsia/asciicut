# CI gates for the asciicut Cargo workspace.
#
# Enforces the stack-checklist gate order (cheapest first) on BOTH compile
# targets of the one engine (SPEC §7.4):
#   fmt-check → clippy (deny warnings) → test → build
#
# Native runs the full set. For wasm32-unknown-unknown, `cargo test` cannot
# execute without a wasm runner and `--all-targets` pulls in test/bench
# harnesses that do not build for that target; so the wasm job runs lib clippy
# and `cargo build` to produce and verify the `asciicut_core.wasm` artifact
# (AC#3). The `wasm32-unknown-unknown` target is provisioned from
# `rust-toolchain.toml`.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (build · test · clippy · fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build (release)
        run: cargo build --release

  wasm:
    name: WASM (clippy · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (wasm, deny warnings)
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Build (wasm)
        run: cargo build --target wasm32-unknown-unknown

      - name: Verify asciicut_core.wasm artifact exists
        run: test -f target/wasm32-unknown-unknown/debug/asciicut_core.wasm

  web:
    name: Web (typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Provision the release wasm the SPA imports BEFORE any npm step — a fresh
      # checkout has no target/, so `vite build` cannot resolve the gitignored
      # asciicut_core.wasm import without it. The web job owns its own release
      # artifact (D6) and never depends on the debug `wasm` job's output.
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('**/Cargo.lock') }}

      - name: Build asciicut_core.wasm (release)
        run: cargo build --target wasm32-unknown-unknown --release -p asciicut-core

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        working-directory: web

      - name: Build (build:wasm copy + vite build)
        run: npm run build
        working-directory: web
