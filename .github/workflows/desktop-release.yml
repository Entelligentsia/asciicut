# Packaged desktop installer builds for asciicut (CASTCU-S2-T06).
#
# Trigger: on a published GitHub Release (ships the installer matrix with the
# release), plus manual `workflow_dispatch` on demand. A three-OS matrix that
# downloads a full ffmpeg static build per leg is a release-shaped job, never a
# per-commit one — see BUILD.md's "CI (macOS/Windows path)" section for the
# full rationale.
#
# Each matrix leg runs exactly the steps crates/asciicut-desktop/BUILD.md
# documents for that platform: checkout, Rust + Node setup, (Linux only)
# system deps, fmt/clippy scoped to this crate's detached workspace,
# sidecars/fetch-sidecars.sh, tauri build --bundles <platform formats>,
# upload-artifact. The ubuntu-latest leg is the one leg this repo's own
# sandbox can and does run for real (see PROGRESS.md); the macos-latest /
# windows-latest legs are reviewed, not executed, from that sandbox.
name: Desktop release build

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write     # "Attach installers to the release" (gh release upload)
      id-token: write     # OIDC token minted for build-provenance attestation
      attestations: write # write the provenance attestation for each installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (.deb + AppImage)
            bundles: deb,appimage
          - os: macos-latest
            name: macOS (.dmg + .app)
            bundles: dmg,app
          - os: windows-latest
            name: Windows (.msi + .exe/nsis)
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (WebKitGTK 4.1 + GTK3 + friends)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Add wasm target (SPA build:wasm step)
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (includes @tauri-apps/cli)
        run: npm ci
        working-directory: web

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/asciicut-desktop/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('crates/asciicut-desktop/Cargo.lock') }}

      # Fetch sidecars BEFORE any compile step: tauri-build validates the
      # externalBin resources declared in tauri.conf.json at build-script time,
      # which both `cargo clippy` and `tauri build` trigger — so the binaries
      # must already be staged or the build script fails with "resource path
      # `sidecars/agg-<triple>` doesn't exist".
      - name: Fetch bundled sidecars (agg + ffmpeg)
        # Force bash: on windows-latest the default shell is PowerShell, which
        # dot-sources this .sh as a PowerShell script (silent no-op, exit 0) and
        # stages no sidecars. Git Bash runs it as intended.
        shell: bash
        run: ./sidecars/fetch-sidecars.sh
        working-directory: crates/asciicut-desktop
        env:
          # macOS ffmpeg has no BtbN upstream. fetch-sidecars.sh now defaults to
          # pinned OSXExperts GPL static builds (see sidecars/README.md), so
          # these secrets are OPTIONAL — set them only to override the default
          # source. An unset secret is an empty string, which the script's
          # `${VAR:-default}` falls back on.
          FFMPEG_MACOS_X86_64_URL: ${{ secrets.FFMPEG_MACOS_X86_64_URL }}
          FFMPEG_MACOS_AARCH64_URL: ${{ secrets.FFMPEG_MACOS_AARCH64_URL }}

      - name: Format check (detached desktop workspace)
        run: cargo fmt --all --manifest-path crates/asciicut-desktop/Cargo.toml -- --check

      - name: Clippy (detached desktop workspace, deny warnings)
        run: cargo clippy --all-targets --all-features --manifest-path crates/asciicut-desktop/Cargo.toml -- -D warnings

      - name: Build installer(s)
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        working-directory: web

      # SHA-256 over this leg's installers, by basename so `sha256sum -c
      # SHA256SUMS-<OS>.txt` verifies against the flat release download layout.
      # Per-OS filename (runner.os = Linux/macOS/Windows) so the three matrix
      # legs don't clobber one shared file when attaching to the release.
      - name: Checksums (SHA-256)
        shell: bash
        working-directory: crates/asciicut-desktop/target/release/bundle
        run: |
          shopt -s nullglob
          sums="SHA256SUMS-${{ runner.os }}.txt"
          : > "$sums"
          for f in deb/*.deb appimage/*.AppImage dmg/*.dmg msi/*.msi nsis/*.exe; do
            sha256sum "$f" | awk -v b="$(basename "$f")" '{print $1"  "b}' >> "$sums"
          done
          if [ ! -s "$sums" ]; then
            echo "no installers found to checksum" >&2
            exit 1
          fi
          cat "$sums"

      # Free, keyless supply-chain provenance: cryptographically ties each
      # installer to this commit + workflow run (verify with `gh attestation
      # verify <file> -R Entelligentsia/asciicut`). No certificate needed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: crates/asciicut-desktop/target/release/bundle/SHA256SUMS-${{ runner.os }}.txt

      - name: Upload installer artifact(s)
        uses: actions/upload-artifact@v7
        with:
          name: asciicut-${{ matrix.os }}
          path: |
            crates/asciicut-desktop/target/release/bundle/deb/*.deb
            crates/asciicut-desktop/target/release/bundle/appimage/*.AppImage
            crates/asciicut-desktop/target/release/bundle/dmg/*.dmg
            crates/asciicut-desktop/target/release/bundle/macos/*.app
            crates/asciicut-desktop/target/release/bundle/msi/*.msi
            crates/asciicut-desktop/target/release/bundle/nsis/*.exe
            crates/asciicut-desktop/target/release/bundle/SHA256SUMS-*.txt
          if-no-files-found: ignore

      - name: Attach installers to the GitHub Release
        # Only when triggered by a published release (not a manual dispatch,
        # which has no release to attach to — those keep the run artifact above).
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # .dmg (not .app, which is a directory) is the macOS release asset.
          files=(
            crates/asciicut-desktop/target/release/bundle/deb/*.deb
            crates/asciicut-desktop/target/release/bundle/appimage/*.AppImage
            crates/asciicut-desktop/target/release/bundle/dmg/*.dmg
            crates/asciicut-desktop/target/release/bundle/msi/*.msi
            crates/asciicut-desktop/target/release/bundle/nsis/*.exe
            crates/asciicut-desktop/target/release/bundle/SHA256SUMS-*.txt
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer files found to attach" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

      - name: Linux packaged-build smoke (window launch + resolver + real export)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb wmctrl x11-utils
          ./scripts/smoke-packaged-build.sh --skip-build
        working-directory: crates/asciicut-desktop
