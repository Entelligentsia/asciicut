# Packaged desktop installer builds for asciicut (CASTCU-S2-T06).
#
# Manually triggered (workflow_dispatch), NOT part of ci.yml's per-push/PR
# gate: a three-OS matrix that downloads a full ffmpeg static build per leg
# is a release-shaped job, not a per-commit one — see BUILD.md's "CI
# (macOS/Windows path)" section for the full rationale.
#
# Each matrix leg runs exactly the steps crates/asciicut-desktop/BUILD.md
# documents for that platform: checkout, Rust + Node setup, (Linux only)
# system deps, fmt/clippy scoped to this crate's detached workspace,
# sidecars/fetch-sidecars.sh, tauri build --bundles <platform formats>,
# upload-artifact. The ubuntu-latest leg is the one leg this repo's own
# sandbox can and does run for real (see PROGRESS.md); the macos-latest /
# windows-latest legs are reviewed, not executed, from that sandbox.
name: Desktop release build

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (.deb + AppImage)
            bundles: deb,appimage
          - os: macos-latest
            name: macOS (.dmg + .app)
            bundles: dmg,app
          - os: windows-latest
            name: Windows (.msi + .exe/nsis)
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (WebKitGTK 4.1 + GTK3 + friends)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Add wasm target (SPA build:wasm step)
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (includes @tauri-apps/cli)
        run: npm ci
        working-directory: web

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/asciicut-desktop/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('crates/asciicut-desktop/Cargo.lock') }}

      - name: Format check (detached desktop workspace)
        run: cargo fmt --all --manifest-path crates/asciicut-desktop/Cargo.toml -- --check

      - name: Clippy (detached desktop workspace, deny warnings)
        run: cargo clippy --all-targets --all-features --manifest-path crates/asciicut-desktop/Cargo.toml -- -D warnings

      - name: Fetch bundled sidecars (agg + ffmpeg)
        run: ./sidecars/fetch-sidecars.sh
        working-directory: crates/asciicut-desktop
        env:
          # macOS ffmpeg has no BtbN upstream (see sidecars/README.md); a
          # release run must supply a real static-build URL here as a repo/
          # org secret before this leg produces a usable macOS installer.
          FFMPEG_MACOS_X86_64_URL: ${{ secrets.FFMPEG_MACOS_X86_64_URL }}
          FFMPEG_MACOS_AARCH64_URL: ${{ secrets.FFMPEG_MACOS_AARCH64_URL }}

      - name: Build installer(s)
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        working-directory: web

      - name: Upload installer artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: asciicut-${{ matrix.os }}
          path: |
            crates/asciicut-desktop/target/release/bundle/deb/*.deb
            crates/asciicut-desktop/target/release/bundle/appimage/*.AppImage
            crates/asciicut-desktop/target/release/bundle/dmg/*.dmg
            crates/asciicut-desktop/target/release/bundle/macos/*.app
            crates/asciicut-desktop/target/release/bundle/msi/*.msi
            crates/asciicut-desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Linux packaged-build smoke (window launch + resolver + real export)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb wmctrl x11-utils
          ./scripts/smoke-packaged-build.sh --skip-build
        working-directory: crates/asciicut-desktop
